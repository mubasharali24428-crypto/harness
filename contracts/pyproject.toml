[project]
name = "harness-contracts"
version = "0.4.2"
description = "Frozen shared contracts for the AI Engineering Harness. Owned by Section 1."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "cryptography>=42"]

[project.optional-dependencies]
fastapi-auth = ["fastapi>=0.100", "sqlalchemy[asyncio]>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
