<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>W10 session fixture</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #ffffff; }
  .stage { position: relative; height: 420px; }
  h1 { margin: 0; padding: 20px 40px 0; font-size: 24px; }
  #chart { position: absolute; left: 40px; top: 120px; width: 240px; height: 160px; }
  #toggle { position: absolute; left: 40px; top: 300px; font-size: 16px; padding: 6px 12px; }
  #name { position: absolute; left: 320px; top: 300px; width: 240px; font-size: 16px; padding: 4px; }
  #echo { position: absolute; left: 320px; top: 340px; font-size: 14px; color: #333; }
  #clip { position: absolute; left: 40px; top: 360px; font-size: 12px; color: #555; }
  #dl { position: absolute; left: 40px; top: 385px; font-size: 14px; }
  .spacer { height: 2400px; background: linear-gradient(#f7f7f7, #e9eef5); }
</style>
</head>
<body>
<div class="stage">
  <h1>Notification settings</h1>
  <canvas id="chart" width="240" height="160" role="img"
          aria-label="Weekly signups chart">Weekly signups</canvas>
  <button id="toggle" type="button" aria-pressed="false" aria-controls="chart">
    Notifications off
  </button>
  <label for="name" style="position:absolute;left:320px;top:278px;font-size:13px">Your name</label>
  <input id="name" type="text" autocomplete="off">
  <div id="echo" aria-live="polite">Hello,</div>
  <div id="clip">CLIP: pending</div>
  <a id="dl" download="w10-report.txt"
     href="data:text/plain;base64,VzEwIGRvd25sb2FkIGZpeHR1cmU=">Download report</a>
</div>
<div class="spacer"></div>
<script>
  const state = { before: "#b3261e", after: "#1a7f37" };
  const canvas = document.getElementById("chart");
  const toggle = document.getElementById("toggle");
  const ctx = canvas.getContext("2d");
  const paint = (on) => {
    ctx.fillStyle = on ? state.after : state.before;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  };
  paint(false);
  toggle.addEventListener("click", () => {
    const on = toggle.getAttribute("aria-pressed") !== "true";
    toggle.setAttribute("aria-pressed", on ? "true" : "false");
    toggle.textContent = on ? "Notifications on" : "Notifications off";
    paint(on);
  });
  const name = document.getElementById("name");
  name.addEventListener("input", () => {
    document.getElementById("echo").textContent = "Hello, " + name.value;
  });
  // The page is not allowed to read the clipboard; record what actually happens.
  (async () => {
    const out = document.getElementById("clip");
    try {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        out.textContent = "CLIP: UNAVAILABLE";
        return;
      }
      const text = await navigator.clipboard.readText();
      out.textContent = "CLIP: READ:" + text;
    } catch (err) {
      out.textContent = "CLIP: DENIED:" + err.name;
    }
  })();
</script>
</body>
</html>
