# Repo-level gitleaks config (extends the official default ruleset).
#
# The allowlist below pins hand-verified FALSE POSITIVES only: placeholder
# values in test fixtures and one docstring phrase, never real credentials.
# gitleaks-action scans full history (fetch-depth: 0), so per-commit findings
# from older revisions cannot be silenced by inline comments in new commits —
# these regexes are applied to every scan, worktree or history alike.
# Each entry was inspected at its source before being listed here.
# Recorded in docs/pilot-remediation/RISK_REGISTER.md (OPS-21).

[extend]
useDefault = true

[allowlist]
description = "hand-verified fake fixture values (not credentials)"
regexes = [
    # section1/tests/test_api_keys_routes.py — placeholder BYO-API-key fixture
    '''sk-proj-abcdef1234567890SECRET''',
    # section5/tests/unit/test_policy.py — env-sanitization fixture
    '''ghp_1234567890''',
    # section6/tests/unit/test_ai_llm_wiring.py — placeholder provider key
    '''sk-live-abcdef1234''',
    # section10/tests/unit/test_deploy_boot_gate.py — placeholder 32-hex value
    '''0123456789abcdef0123456789abcdef''',
    # section3/src/harness_router/providers.py — docstring prose
    # "(no key, HARNESS_ENV=dev ONLY)", matched by the generic-api-key
    # heuristic; a public env var name and value, not a secret.
    '''HARNESS_ENV=dev''',
    # Full-history (schedule) scan findings, hand-verified 2026-11-04 at their
    # source commits. Every value below is a synthetic fixture or a public
    # documentation example, never a live credential. Push-diff scans never
    # surfaced them because they live in historical revisions.
    # AWS's own docs example access key id, used by several test suites.
    '''AKIAIOSFODNN7EXAMPLE''',
    # integrations/editors leak-gate fixtures.
    '''AKIAABCDEFGHIJKLMNOP''',
    # integrations/connectors redaction fixtures.
    '''sk_live_abcdef1234567890''',
    # docs/briefs/evidence/s12/part52-probe wrapper fixture.
    '''sk-probe0123456789''',
    # packages/security-policy scanner fixtures.
    '''sk-abcdefghijklmnopqrstuvwxyz0123456789''',
    '''A1b2C3d4E5f6G7h8I9j0''',
    # Slack token fixtures (prefix match also covers the 12-digit variant).
    '''xoxb-1234567890''',
    # packages/telemetry and section2 gitflow scrub fixtures.
    '''ghp_AbCdEfGhIjKlMnOpQrStUvWxYz0123456789''',
    '''ghp_abcdefghijklmnopqrstuvwxyz0123456789''',
    # integrations/editors/vscode extension fixture.
    '''tok-SECRET-12345678''',
    # PEM bodies: importer, agent-config, secret-hygiene and secret-scan fixtures.
    '''SYNTHETIC-KEY-BODY''',
    '''MIIEvQIBADANBgkqhkiG9w0BAQEFAASC''',
    '''MIIEowIBAAKCAQEA1234567890abcdef''',
    '''MIIEow\.\.\.''',
    # section11 secret-hygiene fixture: the jwt.io sample token.
    '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.SflKxwRJSMeKKF2QT4''',
    # Newer gitleaks default rules (8.30) flag these two code/prose fragments
    # under generic-api-key; neither is a credential shape.
    '''presence/typing/cursor''',
    '''reserved_usd=amount''',
    # First gitleaks execution in this repo's history (2026-11-22: ci-local
    # 2026-11-22T0451Z + a redacted rerun, 871 commits reachable from HEAD)
    # surfaced 7 findings. Every one was inspected at its source the same day
    # and is a synthetic fixture in a redaction-behavior test — a fake value
    # whose entire purpose is to assert that strings shaped like it get
    # scrubbed. No live credential; recorded in the findings ledger 2026-11-22.
    # section7/src/lib/redact.test.ts:10,14,16 + runTimeline.test.ts:168,174
    '''abc123SECRET''',
    '''sk-SECRET123''',
    '''abcdef123456''',
    # section4/tests/unit/test_verdict_comment.py:53,55,57,63,116,121
    '''sk-abc123secret''',
    '''abc123token''',
    '''sk-zzz99999999''',
    '''sk-leak99999''',
    # section4/tests/unit/test_verdict_post.py:26 — its own header comment
    # (line 12) explains the runtime-assembly trick for token-shaped literals;
    # this one literal was missed by that trick.
    '''tok-live-secret-123''',
    # section8/tests/unit/test_pre_review.py:87,129 — truncated, non-functional
    # PEM stub asserting private-key scrubbing.
    '''MIIBOgIBAAJ''',
    # Not covered above (full-history scan, verified 2026-11-27):
    # redact.test.ts:18 PEM stub; test_pre_review.py:86 fake API_KEY value.
    '''\\nMIIE\\n''',
    '''super-secret-value-123''',
]
