[project]
name = "harness-meeting"
version = "0.1.0"
description = "Section 6: Meeting Area for AI Engineering Harness."
requires-python = ">=3.11"
dependencies = [
    "harness-contracts",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # M12-F1/G3: envelope middleware + caps tests import harness_identity's
    # limiter/envelope modules, which need an ORM + sqlite driver present.
    # [asyncio] extra: async engine needs greenlet — CI failed on its absence
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests", "../contracts/src", "../section1/src"]
# M13-H3b (W2 carryover #3): silence third-party datetime deprecations that S6
# cannot fix from here. Both roots live outside this section:
#  - aiosqlite's default datetime adapter fires inside the SHARED section1
#    rate-limit store (test_g2_ratelimit_hooks drives it over aiosqlite);
#    the real cure is ISO-8601 TEXT storage, owned by lane H4b (timeutil).
#  - starlette's httpx notice comes from fastapi's own testclient module import.
filterwarnings = [
    "ignore:The default datetime adapter is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
