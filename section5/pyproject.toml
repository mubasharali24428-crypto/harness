[project]
name = "harness-sandbox"
version = "0.1.0"
description = "Section 5: Sandbox Execution Service for AI Engineering Harness."
requires-python = ">=3.11"
dependencies = [
    "harness-contracts",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    # P2 (security master prompt): property-based fuzzing of the shell gate.
    "hypothesis>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# W4: the egress allow-list is generated data, not code; without this line an
# installed (non-editable) package would lose it and deny every destination.
[tool.setuptools.package-data]
harness_sandbox = ["egress_allowlist.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests", "../contracts/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
