# Keep sdk-minimal's tools and confinement; replace only the transport adapter.
# The native DeepSeek adapter speaks Anthropic Messages in SDK 0.2.1rc2.
- id: llm-deepseek
  disabled: true
- insert:
    - id: llm-openrouter
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          deepseek-official:
            api: openai-completions
            apiKeyEnv: DEEPSEEK_API_KEY
            baseURL: !!js process.env.DEEPSEEK_BASE_URL
            models:
              - id: !!js process.env.DSH_MODEL
                contextWindow: 65536
                maxTokens: 4096
                input: [text]
