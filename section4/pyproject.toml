[project]
name = "harness-orchestrator"
version = "0.1.0"
description = "Section 4: Agent Orchestration Engine for AI Engineering Harness."
requires-python = ">=3.11"
dependencies = [
    "harness-contracts",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# live engine: pinned to the versions verified in docs/briefs/multiplayer-readiness.md
live = [
    "deepseek-harness-sdk==0.2.1rc2",
    "deepseek-harness-runtime-bin==0.2.1rc2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    # D5 ownership-guard tests exercise the projects→teams join against sqlite.
    "aiosqlite>=0.20",
    "greenlet>=3",
    "sqlalchemy[asyncio]>=2",
    # scripts/spec_drift.py imports the deployed app, whose DSN uses asyncpg.
    "asyncpg>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_orchestrator = ["dsh_plugins/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests", "../contracts/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
