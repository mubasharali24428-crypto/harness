[project]
name = "harness-extensions"
version = "1.0.0rc1"
description = "Harness extensions plane (A5): external MCP server registry/client, deny-by-default tool grants, versioned skills/playbooks and a digest-verified plugin catalog served under /api/v1/extensions."
requires-python = ">=3.11"
dependencies = [
    "harness-contracts",
    # Same pin as mcp/: the 1.x API surface is what the server/client code targets.
    "mcp>=1.2,<2",
    "fastapi>=0.110",
    "httpx>=0.27",
    "anyio>=4",
    "uvicorn>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
# Standalone deployment extras: bearer auth against the frozen Section-1 schema.
server = [
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.29",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_extensions = ["catalog/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests", "../../contracts/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
