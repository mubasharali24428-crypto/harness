[project]
name = "harness-extensions"
version = "0.1.0"
description = "A5 extensions lane building blocks: external MCP client, SSRF host policy and untrusted tool-schema guard. Registry, grants, wrappers, skills, signed catalog and the /api/v1/extensions service are not built yet."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.111", "uvicorn>=0.30", "httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "PLW"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
