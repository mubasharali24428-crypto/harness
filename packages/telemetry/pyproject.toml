[project]
name = "harness-telemetry"
version = "0.1.0"
description = "Tracing, measurable value metrics and a searchable run archive for Harness: OTel span export from frozen agent events, quality/productivity/cost dashboards with transparent denominators, PII-scrubbed org-wide archive with team-scoped access. A measured accepted change is an observed PR plus independent review pass — never a model claiming completion."
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
