# M13-H3b (lane convergence): every GATE step below is `make <target>` from the
# repo Makefile — the single source of truth. What runs locally (`make test`,
# `make lint`, `make gate`) is what runs here, byte-for-byte; drift between
# local and CI is structurally impossible. Only PROVISIONING (venv creation,
# npm ci, pip installs) stays native to CI.
#
# Job names are STABLE — branch protection references them. Mapping table:
#   docs/ci-gates.md
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Nightly security probe run (PG-backed integration tests included).
    - cron: "17 6 * * *"
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  static-gates:
    name: static gates (shell parse, compose config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: entrypoint.sh parses (GAP-F1 regression guard) [make static-gates]
        run: sh -n deploy/entrypoint.sh
      - name: compose file valid [make static-gates]
        run: docker compose -f deploy/docker-compose.yml config -q
      # Kept stepwise instead of one `make static-gates` line only because the
      # runner's preinstalled docker/python differ per action image; the three
      # commands are verbatim the Makefile recipe. See docs/ci-gates.md.
      - name: TS contract mirror is current (E-codegen drift guard) [make static-gates]
        run: python3 contracts/ts/generate.py --check
      # M15-G6a (W4 carryover #4 + M13 isolation law): route modules export
      # default ONLY; sections import ONLY contracts/. One step runs both law
      # guards; the script prints file:line per violation. Kept stepwise like
      # the three gates above (runner sh is dash; the Makefile invokes bash).
      - name: Route-module + isolation laws (M15-G6a) [make guard-routes + make guard-isolation]
        run: |
          make --no-print-directory guard-routes
          make --no-print-directory guard-isolation

  python-tests:
    name: pytest (${{ matrix.section }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        section: [section1, section2, section3, section4, section5, section6, section8, section10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # harness-contracts is a path dependency (not on PyPI): install it into the
      # section's own venv first, then the section itself — mirroring how local
      # venvs were built (editable install of contracts + section).
      - name: Install deps (contracts + section, shared venv)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q -e ../contracts
          ./.venv/bin/pip install -q -e ".[dev]" || ./.venv/bin/pip install -q -e .
        working-directory: ${{ matrix.section }}
      # The gates themselves are the Makefile recipes — identical lines locally.
      - name: ruff [make lint-${{ matrix.section }}]
        run: make --no-print-directory lint-${{ matrix.section }}
        working-directory: ${{ github.workspace }}
      - name: pytest [make test-${{ matrix.section }}]
        run: make --no-print-directory test-${{ matrix.section }}
        working-directory: ${{ github.workspace }}

  frontend:
    name: vitest + tsc (section7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: section7/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: section7
      - name: tsc [make frontend-tsc]
        run: make --no-print-directory frontend-tsc
      - name: vitest [make frontend-vitest]
        run: make --no-print-directory frontend-vitest

  nightly-pg-probe:
    name: nightly real-PG integration probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install section1
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q ../contracts -e .
        working-directory: section1
      - name: Real-PG fanout + rehydration probes (G-LIVE regression guard) [make pg-probe-integration]
        run: make --no-print-directory pg-probe-integration
        env:
          HARNESS_TEST_PG: "1"
          HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@localhost:5499/harness
      - name: S1 suite against real PG [make pg-probe-s1]
        run: make --no-print-directory pg-probe-s1
        env:
          HARNESS_TEST_PG: "1"
          HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@localhost:5499/harness

  security-scan:
    # Wave9-E: supply-chain + secret scanning. pip-audit is WARN-posture this
    # wave (continue-on-error); gitleaks blocks. Do not restructure existing jobs.
    name: security scan (pip-audit warn + gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans full history; shallow clones would skip most commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install section1 env (audit target)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q -e ../contracts -e ".[dev]" \
            || ./.venv/bin/pip install -q -e ../contracts -e .
        working-directory: section1
      - name: pip-audit (WARN only this wave) [make pip-audit]
        continue-on-error: true
        run: |
          ./.venv/bin/pip install -q pip-audit
          ./.venv/bin/pip-audit --progress-spinner off
        working-directory: section1
      - name: gitleaks (official action, blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
