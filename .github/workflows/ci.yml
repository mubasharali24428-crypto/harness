# M13-H3b (lane convergence): every GATE step below is `make <target>` from the
# repo Makefile — the single source of truth. What runs locally (`make test`,
# `make lint`, `make gate`) is what runs here, byte-for-byte; drift between
# local and CI is structurally impossible. Only PROVISIONING (venv creation,
# npm ci, pip installs) stays native to CI.
#
# Job names are STABLE — branch protection references them. Mapping table:
#   docs/ci-gates.md
name: CI

permissions:
  contents: read
  # gitleaks-action enumerates a PR's commits on pull_request events; without
  # this it fails with HTTP 403 and blocks the whole job.
  pull-requests: read

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Nightly security probe run (PG-backed integration tests included).
    - cron: "17 6 * * *"
  workflow_dispatch:

# I-04-adjacent (CI-minutes diet, 2026-11-21): a push that supersedes another
# (the same branch pushed twice while the first run is in flight) cancels the
# stale run instead of paying for both. Skipped-vs-paid: a cancelled run pays
# only for the seconds it executed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # CI-minutes diet: one cheap job decides which expensive jobs are worth
  # paying for. Filters are named EXACTLY like the matrix sections they gate
  # (python-tests reads its section name out of this list with contains()).
  # Jobs not gated by a filter: static-gates, frontend (a branch-protection
  # REQUIRED check — a skipped required check must never be merge-gating
  # ambiguity), security-scan (security posture runs on every tree).
  # On schedule/dispatch every filter reports true: the nightly probe pays for
  # the whole suite by definition.
  changes:
    name: which jobs does this change actually touch?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.resolve.outputs.changes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The nightly probe and by-hand runs have no diff to reason about: they
      # pay for the whole suite by definition. Every gated job's `if` also
      # short-circuits on these events, so the list here is belt-and-braces —
      # it exists so `needs: changes` can never fail the nightly on a filter
      # error.
      - name: schedule/dispatch => the full suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: forced
        run: |
          echo 'changes=["section1","section2","section3","section4","section5","section6","section8","section10","section11","mcp","language","e2e","migrations"]' >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          # shared prefix in every filter: contracts is a path dependency of
          # every section, and the Makefile recipes ARE the gates.
          filters: |
            section1:
              - 'contracts/**'
              - 'Makefile'
              - 'section1/**'
            section2:
              - 'contracts/**'
              - 'Makefile'
              - 'section2/**'
            section3:
              - 'contracts/**'
              - 'Makefile'
              - 'section3/**'
            section4:
              - 'contracts/**'
              - 'Makefile'
              - 'section4/**'
            section5:
              - 'contracts/**'
              - 'Makefile'
              - 'section5/**'
            section6:
              - 'contracts/**'
              - 'Makefile'
              - 'section6/**'
            section8:
              - 'contracts/**'
              - 'Makefile'
              - 'section8/**'
            section10:
              - 'contracts/**'
              - 'Makefile'
              - 'section10/**'
            section11:
              - 'contracts/**'
              - 'Makefile'
              - 'section11/**'
            mcp:
              - 'contracts/**'
              - 'Makefile'
              - 'mcp/**'
            language:
              - 'contracts/**'
              - 'Makefile'
              - 'packages/language/**'
            e2e:
              - 'contracts/**'
              - 'Makefile'
              - 'deploy/**'
              - 'section4/**'
              - 'section7/e2e/**'
            migrations:
              - 'contracts/**'
              - 'Makefile'
              - 'section1/migrations/**'
              - 'section1/src/**'
              - 'deploy/runners/**'
      - name: resolve the list for the job output
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "changes=${{ steps.filter.outputs.changes }}" >> "$GITHUB_OUTPUT"
          else
            echo "changes=${{ steps.forced.outputs.changes }}" >> "$GITHUB_OUTPUT"
          fi

  static-gates:
    name: static gates (shell parse, compose config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: entrypoint.sh parses (GAP-F1 regression guard) [make static-gates]
        run: sh -n deploy/entrypoint.sh
      - name: compose file valid [make static-gates]
        run: docker compose -f deploy/docker-compose.yml config -q
      # Each step below is verbatim a line of the `make static-gates` recipe
      # (kept stepwise because the runner's preinstalled docker/python differ
      # per action image — see docs/ci-gates.md). The recipe's `spec_drift.py`
      # line has NO CI step: it imports the FastAPI apps, so it needs a section
      # venv this job does not build. That is a known coverage gap, not an
      # oversight of the two stdlib gates added here.
      - name: eval corpus contract holds (W14 gate) [make static-gates]
        run: python3 scripts/eval/run_eval.py --check
      - name: every runtime env knob is documented (W15 gate) [make static-gates]
        run: python3 scripts/check_env_knobs.py
      - name: TS contract mirror is current (E-codegen drift guard) [make static-gates]
        run: python3 contracts/ts/generate.py --check
      # M15-G6a (W4 carryover #4 + M13 isolation law): route modules export
      # default ONLY; sections import ONLY contracts/. One step runs both law
      # guards; the script prints file:line per violation. Kept stepwise like
      # the three gates above (runner sh is dash; the Makefile invokes bash).
      - name: Route-module + isolation laws (M15-G6a) [make guard-routes + make guard-isolation]
        run: |
          make --no-print-directory guard-routes
          make --no-print-directory guard-isolation

  python-tests:
    name: pytest (${{ matrix.section }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # Minutes diet: only the sections this change can affect. The nightly
    # probe (schedule/dispatch) always pays for the whole suite.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(fromJSON(needs.changes.outputs.changes), matrix.section)
    strategy:
      fail-fast: false
      matrix:
        section: [section1, section2, section3, section4, section5, section6, section8, section10, section11]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            contracts/pyproject.toml
            ${{ matrix.section }}/pyproject.toml
      # harness-contracts is a path dependency (not on PyPI): install it into the
      # section's own venv first, then the section itself — mirroring how local
      # venvs were built (editable install of contracts + section).
      - name: Install deps (contracts + section, shared venv)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q -e ../contracts
          ./.venv/bin/pip install -q -e ".[dev]" || ./.venv/bin/pip install -q -e .
        working-directory: ${{ matrix.section }}
      # The gates themselves are the Makefile recipes — identical lines locally.
      - name: ruff [make lint-${{ matrix.section }}]
        run: make --no-print-directory lint-${{ matrix.section }}
        working-directory: ${{ github.workspace }}
      - name: pytest [make test-${{ matrix.section }}]
        run: make --no-print-directory test-${{ matrix.section }}
        working-directory: ${{ github.workspace }}

  mcp:
    name: mcp server (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(fromJSON(needs.changes.outputs.changes), 'mcp')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            contracts/pyproject.toml
            mcp/pyproject.toml
      - name: Install mcp (contracts first, same as make bootstrap)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q -e ../contracts
          ./.venv/bin/pip install -q -e ".[dev]"
        working-directory: mcp
      - name: ruff [make lint-mcp]
        run: make --no-print-directory lint-mcp
        working-directory: ${{ github.workspace }}
      - name: pytest [make test-mcp]
        run: make --no-print-directory test-mcp
        working-directory: ${{ github.workspace }}

  language:
    name: hx checker + workflow driver (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(fromJSON(needs.changes.outputs.changes), 'language')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            contracts/pyproject.toml
            packages/language/pyproject.toml
      - name: Install harness-hx (contracts first, same as make bootstrap)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q -e ../../contracts
          ./.venv/bin/pip install -q -e ".[dev]"
        working-directory: packages/language
      - name: ruff [make lint-language]
        run: make --no-print-directory lint-language
        working-directory: ${{ github.workspace }}
      - name: pytest [make test-language]
        run: make --no-print-directory test-language
        working-directory: ${{ github.workspace }}

  frontend:
    # Job name matches the branch-protection required check ("vitest + tsc
    # (section7)") byte-for-byte — a rename without updating the protection rule
    # orphans the required context and blocks every merge, so the label stays
    # exactly what the rule expects. Steps unchanged (tsc + vitest + published
    # TS dist verification included).
    name: vitest + tsc (section7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            section7/package-lock.json
            clients/ts/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: section7
      - name: tsc [make frontend-tsc]
        run: make --no-print-directory frontend-tsc
      - name: vitest [make frontend-vitest]
        run: make --no-print-directory frontend-vitest
      # The compiled client in git IS the published artifact; src changes that
      # never rebuild it silently ship a stale API surface (found 2026-10-29).
      - name: npm ci (clients/ts)
        run: npm ci --no-audit --no-fund
        working-directory: clients/ts
      - name: published TS dist is current [make check-ts-dist]
        run: make --no-print-directory check-ts-dist

  # OPS-20: the release gate that boots the REAL stack and runs the whole
  # product journey with zero provider keys (recorded-replay demo seed).
  # This job exists because unit lanes (SQLite create_all, macOS dev boxes)
  # structurally cannot catch live-compose bugs: it already found M18-C8
  # (demo-seed FK insert order on PG) and M18-C9 (landlock version-heuristic
  # said usable while Docker's seccomp blocks the syscalls → every sandbox
  # exec died in preexec_fn). Every step mirrors a local command verbatim.
  e2e-compose:
    name: e2e (compose journey, zero provider keys)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(fromJSON(needs.changes.outputs.changes), 'e2e')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: provision master key (CI has no .env by design; migrate refuses empty)
        run: echo "HARNESS_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: build images (shared backend + db + frontend; walg profile excluded)
        run: docker compose -f deploy/docker-compose.yml build
      - name: boot stack (migrate runs as service_completed_successfully dependency)
        # No service list: boot the full default set. The journey's step 0
        # asserts every enabled compose service has the container it should
        # have, so underbooting here fails the stack-shape gate — the four
        # sidecars (sandbox-egress, events-retention, webhook-delivery,
        # siem-push) must boot for the journey to make any sense at all.
        run: >-
          docker compose -f deploy/docker-compose.yml up -d
      - name: verify migrate one-shot exited 0 (fail fast, not inside the journey)
        run: |
          cid=$(docker compose -f deploy/docker-compose.yml ps -aq migrate)
          test -n "$cid" || { echo "migrate container missing"; exit 1; }
          code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
          echo "migrate exit code: $code"
          test "$code" = "0"
      - name: compose journey [make e2e-compose]
        run: make --no-print-directory e2e-compose
      - name: dump compose logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail 500 > /tmp/e2e-compose-logs.txt 2>&1 || true
      - name: upload compose logs artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-compose-logs
          path: /tmp/e2e-compose-logs.txt
          retention-days: 7
      - name: teardown (volumes included — fresh DB each run)
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  nightly-pg-probe:
    name: nightly real-PG integration probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        # M21-CI repair: pgvector-bearing image — migration 0030 provisions
        # context_chunks (see the migrations-pg job comment).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
      - name: Install section1
        # [dev] carries pytest: pg-probe-* targets run pytest FROM this venv
        # (bare `-e .` left it absent — every nightly run died "No module
        # named pytest" before its first probe).
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q ../contracts -e ".[dev]"
        working-directory: section1
      - name: Apply the migration ledger to the service Postgres [deploy/runners/migrate.py]
        # The service container starts empty; the live fanout probe seeds real
        # parent rows (teams/projects/agent_runs) and needs the migrated shape.
        # Idempotent: schema_migrations makes a re-run a no-op.
        run: ./.venv/bin/python ../deploy/runners/migrate.py
        working-directory: section1
        env:
          HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@localhost:5499/harness
          HARNESS_ALLOW_DEV_MASTER_KEY: "1"
      - name: Real-PG fanout + rehydration probes (G-LIVE regression guard) [make pg-probe-integration]
        run: make --no-print-directory pg-probe-integration
        env:
          HARNESS_TEST_PG: "1"
          HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@localhost:5499/harness
          # The service container above already owns 5499. Without external
          # mode, `make pg-probe-*` runs `pg-up`, which starts the compose
          # `db` and tries to publish 5499 again — every nightly died there
          # with "address already in use". The container id is what the
          # live-PG probes docker-exec `psql` into (compose `db` is absent).
          HARNESS_TEST_PG_EXTERNAL: "1"
          HARNESS_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: S1 suite against real PG [make pg-probe-s1]
        run: make --no-print-directory pg-probe-s1
        env:
          HARNESS_TEST_PG: "1"
          HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@localhost:5499/harness
          HARNESS_TEST_PG_EXTERNAL: "1"
          HARNESS_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: Install section4 (for live-PG probes)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q ../contracts -e ".[dev]"
        working-directory: section4
      - name: Section4 live-PG probes [pytest -k live_pg]
        # Default DSN (HARNESS_TEST_PG=1) points at the service Postgres on 5499.
        # These create their own scratch databases; they never touch the service DB.
        run: ./.venv/bin/python -m pytest tests/unit -q -k live_pg -rs
        working-directory: section4
        env:
          HARNESS_TEST_PG: "1"
      - name: Install section11 (for live-PG probe)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q ../contracts -e ".[dev]"
        working-directory: section11
      - name: Section11 live-PG probe [pytest tests/test_live_pg.py]
        # The probe spins up its own pgvector/pgvector:pg18 container on 5591 and drops it.
        run: ./.venv/bin/python -m pytest tests/test_live_pg.py -q
        working-directory: section11
      - name: Section4 context round-trip against section11 [pytest -k roundtrip]
        # The section11 venv now exists on the runner, so the sibling-app
        # round-trip that skips in normal CI can run here.
        run: ./.venv/bin/python -m pytest tests/test_context_resolver.py -q -k roundtrip -rs
        working-directory: section4

  # M17-B2 (OPS-15): the migration runner finally runs in CI against real PG.
  # Backend suites build schemas with SQLite create_all and even the nightly
  # probe used create_all — deploy/runners/migrate.py (dollar-quote splitter,
  # statement ordering, legacy marking, re-run idempotency) had NEVER been
  # executed by any gate. Runs on EVERY PR (not just the nightly schedule):
  # a migration that passes review but breaks the runner must land red here,
  # not fail at the next `docker compose up`. Executes migrate() itself on a
  # per-run scratch database (never the service DB) via make pg-probe-migrate.
  #
  # M21-CI repair: both real-PG services use the pgvector-bearing image
  # (pgvector/pgvector:pg18 == postgres:18 + the vector extension) because
  # migration 0030 provisions context_chunks. Stock postgres:* images made
  # `CREATE EXTENSION vector` fail with FeatureNotSupportedError. Migration
  # 0030 ALSO degrades gracefully when the extension is missing (ledger row
  # lands, feature off), so this image swap is belt-and-braces provisioning,
  # not a correctness dependency.
  migrations-pg:
    name: migrations apply clean on real PG (migrate.py)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(fromJSON(needs.changes.outputs.changes), 'migrations')
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
      - name: Install section1 (sqlalchemy/asyncpg for the migrate runner)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q ../contracts -e .
        working-directory: section1
      - name: migrate.py applies 0001→latest clean [make pg-probe-migrate]
        run: make --no-print-directory pg-probe-migrate
        env:
          HARNESS_TEST_PG: "1"
          # The job's service container owns 5499; do not start a second db.
          HARNESS_TEST_PG_EXTERNAL: "1"
          HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@localhost:5499/harness

  security-scan:
    # Wave9-E: supply-chain + secret scanning. pip-audit is WARN-posture this
    # wave (continue-on-error); gitleaks blocks. Do not restructure existing jobs.
    name: security scan (pip-audit warn + gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # gitleaks scans full history; shallow clones would skip most commits.
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
      - name: Install section1 env (audit target)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q -e ../contracts -e ".[dev]" \
            || ./.venv/bin/pip install -q -e ../contracts -e .
        working-directory: section1
      - name: pip-audit (WARN only this wave) [make pip-audit]
        continue-on-error: true
        run: |
          ./.venv/bin/pip install -q pip-audit
          ./.venv/bin/pip-audit --progress-spinner off
        working-directory: section1
      - name: gitleaks (official action, blocking)
        uses: gitleaks/gitleaks-action@e6dab246340401bf53eec993b8f05aebe80ac636 # v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v2.3.4 fails on PR events while creating its SARIF artifact
          # ("artifact name ... is not valid"); the scan itself is the gate.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # Native-Linux proof for the container-isolated tool path. Docker Desktop on
  # macOS cannot enforce Landlock on a virtiofs bind mount, so this drill only
  # makes sense on a real Linux kernel. It is not a branch-protection context
  # (it builds an image). CI-minutes diet 2026-11-21: it moved from "every
  # master push" (25 min each) to the nightly probe + by hand — a periodic
  # proof, not a per-push gate.
  native-linux-container:
    name: native linux container tool drill
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: build image + run drill [scripts/native_linux_drill.sh]
        run: ./scripts/native_linux_drill.sh
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
