[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-sdk"
version = "1.0.0rc1"
description = "Python client SDK for the AI Engineering Harness platform API (generated section clients + ws event streaming runtime)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Engineering Harness" }]
dependencies = [
    "httpx>=0.24",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness = "harness_sdk.cli.main:entry"

[tool.setuptools.packages.find]
include = ["harness_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
