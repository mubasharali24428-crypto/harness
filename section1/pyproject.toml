[project]
name = "harness-identity"
version = "0.1.0"
description = "Section 1: Data & Identity Layer + event bus delivery + audit log."
requires-python = ">=3.11"
dependencies = [
    "harness-contracts",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    # Mission 22 M4: OIDC discovery + token exchange HTTP client (no vendor
    # SDKs — raw OIDC over httpx is the whole point of the SSO lane).
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ../section8/src: M15-G6b — settings_api validates reviewer-threshold PUTs
# against harness_review.heuristic (the shared pure model), so its suite must
# resolve that package. Same cross-section pattern S8 already uses for S1.
pythonpath = [".", "src", "../contracts/src", "../section8/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
