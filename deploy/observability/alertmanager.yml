# Alertmanager: every Prometheus alert is delivered by email (parts 28/55).
# This is a TEMPLATE. The compose `alertmanager` entrypoint replaces each ${VAR} from the service
# environment (the stack's existing HARNESS_SMTP_* settings plus HARNESS_ALERT_EMAIL_TO) into
# /tmp/alertmanager.yml, and writes the SMTP password to a file so it never lands in a config.
# Validate the rendered file: docker compose ... exec alertmanager amtool check-config /tmp/alertmanager.yml
# See docs/runbooks/alerting.md section 7.

global:
  smtp_smarthost: "${HARNESS_SMTP_HOST}:${HARNESS_SMTP_PORT}"
  smtp_from: "${HARNESS_SMTP_FROM}"
  smtp_auth_username: "${HARNESS_SMTP_USERNAME}"
  smtp_auth_password_file: /tmp/smtp_password
  smtp_require_tls: ${HARNESS_SMTP_STARTTLS}

route:
  receiver: email
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # `page` = wake a human now (alerts.yml header): first mail fast, repeated hourly.
    - matchers: ['severity="page"']
      group_wait: 10s
      repeat_interval: 1h
    - matchers: ['severity="warning"']
      repeat_interval: 12h

receivers:
  - name: email
    email_configs:
      - to: "${HARNESS_ALERT_EMAIL_TO}"
        send_resolved: true
