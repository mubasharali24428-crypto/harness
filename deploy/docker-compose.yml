name: harness

x-backend-build: &backend-build
  # M18-C6 (OPS-24): every image gets an explicit, immutable version tag —
  # INCLUDING the service's resolved `image:` ref (top-level key below), so
  # flipping HARNESS_IMAGE_TAG actually recreates every backend on the new
  # tag. No floating :latest anywhere: a rollback needs the previous tag to
  # still exist by NAME. Tag scheme (docs/runbooks/rollback.md §1):
  #   vYYYYMMDD-HHMM  — UTC timestamp when the image was built/tagged,
  #                     monotonically increasing, one per deploy; the active
  #                     value lives in deploy/.env as HARNESS_IMAGE_TAG.
  #                     Rolling back = set it to the previous tag + up -d.
  #   latest          — convenience ALIAS emitted alongside each build;
  #                     compose itself never resolves through it.
  image: harness-backend:v${HARNESS_IMAGE_TAG:-dev-local}
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
    tags:
      - "harness-backend:v${HARNESS_IMAGE_TAG:-dev-local}"
      - "harness-backend:latest"

x-backend-env: &backend-env
  HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@db:5432/harness
  # H-005 (M11-W1-B1): no master-key dev default ships here anymore.
  # Empty default keeps `docker compose config` valid while services.py's
  # fail-fast refuses to boot without a real key; opt back into local dev
  # EXPLICITLY via HARNESS_ALLOW_DEV_MASTER_KEY=1.
  HARNESS_MASTER_KEY: ${HARNESS_MASTER_KEY:-}
  HARNESS_ALLOW_DEV_MASTER_KEY: ${HARNESS_ALLOW_DEV_MASTER_KEY:-}
  HARNESS_CORS_ORIGINS: ${HARNESS_CORS_ORIGINS:-["http://localhost:3000"]}
  # C-001 (M11-W1): default ON — unverified email cannot mint admin teams.
  HARNESS_REQUIRE_OWNERSHIP: ${HARNESS_REQUIRE_OWNERSHIP:-true}
  # C-004/H-006 (M11-W1-B1): engine mode is EXPLICIT and validated at
  # boot (deploy/runners/engine_boot.py). Placeholder/dev defaults are
  # gone: no placeholder API-key value, no implicit local-provider
  # endpoint, no baked-in dev model name, no silent provider/model
  # fallback. Required variables stay UNSET for the operator; boot fails
  # loudly (variable NAMES only) until they are provided.
  # Host-unset ENGINE_LIVE_MODE ⇒ container boots dry (honest stub).
  ENGINE_LIVE_MODE: ${ENGINE_LIVE_MODE:-dry}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
  DSH_MODEL: ${DSH_MODEL:-}
  DSH_WORKSPACE: /tmp/harness-dsh/workspace
  DSH_SESSION_ROOT: /tmp/harness-dsh/sessions
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  # S2's Settings use the HARNESS_ prefix — map the well-known names across.
  HARNESS_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  HARNESS_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  HARNESS_FRONTEND_BASE: ${FRONTEND_BASE:-http://localhost:3000}
  HARNESS_GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8002/api/v1/github/oauth/callback}
  HARNESS_SMTP_HOST: ${HARNESS_SMTP_HOST:-}
  HARNESS_SMTP_PORT: ${HARNESS_SMTP_PORT:-587}
  HARNESS_SMTP_USERNAME: ${HARNESS_SMTP_USERNAME:-}
  HARNESS_SMTP_PASSWORD: ${HARNESS_SMTP_PASSWORD:-}
  HARNESS_SMTP_FROM: ${HARNESS_SMTP_FROM:-harness@noreply.local}
  HARNESS_SMTP_STARTTLS: ${HARNESS_SMTP_STARTTLS:-true}

x-backend-depends: &backend-depends
  migrate:
    condition: service_completed_successfully
  db:
    condition: service_healthy

services:
  db:
    # OPS-01 (M17-B2): the LIVE primary now archives WAL itself. Same wiring
    # as the walg-db drill sidecar below: harness-db-walg image (postgres:18 +
    # checksum-verified wal-g binary — stock postgres:*-alpine can never run
    # it, glibc vs musl) + archive_mode/archive_command/hba_file flags.
    # The WAL-G/AWS env knobs below were pre-wired for exactly this move
    # (M13-W3-H2 comment history); they are INERT until a storage prefix is
    # set — with both prefixes empty wal-g fails every push LOUDLY in
    # pg_stat_archiver.failed_count and the log (never silently drops WAL),
    # so an operator cannot mistake archiving for healthy while unset.
    image: harness-db-walg:${WALG_IMAGE_TAG:-v3.0.9}
    build:
      context: ..
      dockerfile: deploy/walg/Dockerfile.walg
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness}
      POSTGRES_DB: harness
      # Identity wal-g uses when archive_command dials back into THIS server
      # (same trick as walg-db): NO PGHOST — libpq falls back to the default
      # unix socket, which the official image's pg_hba trusts for local
      # connections, so no password sits in archive_command-visible env/query
      # text. NOTE: the stock image's generated pg_hba has no `host
      # replication` rule, which streaming base backups need — hence the
      # hba_file flag below pointing at deploy/walg/pg_hba.conf (mount the
      # DIR, not the file; see the gotcha comment on walg-db).
      PGUSER: harness
      PGDATABASE: harness
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
      WALG_FILE_PREFIX: ${WALG_FILE_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      # OPS-09/OPS-08 adjacent: autovacuum knobs for the churn tables
      # (agent_events/rate_buckets/audit_log). All env-tunable, sane defaults
      # documented in .env.example under "Postgres server tuning".
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - pgdata:/var/lib/postgresql
      # Custom HBA (same file as walg-db): streaming base backups need a
      # `host replication` rule the stock generated pg_hba lacks. Mount the
      # DIR — on macOS a bind-mounted FILE pins a stale inode after host-side
      # rewrites (nlink=0/ENOENT, hit live 2026-08-24).
      - ./walg:/etc/harness:ro
      # file:// archive target for THIS cluster (M17-B2): same-path-in-and-out
      # like the walg-db/walg pair below. wal-g's FS backend refuses to mkdir
      # its own root (hit live 2026-08-25), so create it once on the host:
      #   mkdir -p "${WALG_FILE_PREFIX:-/tmp/harness-walg-live}"
      # S3 users ignore this (the mount just sits unused).
      - "${WALG_FILE_PREFIX:-/tmp/harness-walg-live}:${WALG_FILE_PREFIX:-/tmp/harness-walg-live}"
    # M13-W3-H1a pool math (docs/pool-math.md): 7 services × (pool_size=8 +
    # max_overflow=4) = 84 connections worst case; 120 leaves 36 slots of
    # headroom for migrations, admin tooling and operator psql.
    #
    # OPS-01 (M17-B2): archiving flags — identical exec-form argv style as the
    # walg-db sidecar (every element one exact argv word, so `%p` needs no
    # shell-quoting gymnastics). archive_timeout bounds RPO on a quiet db;
    # hba_file selects deploy/walg/pg_hba.conf so streaming base backups can
    # authenticate (stock generated pg_hba lacks `host replication`).
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=${WALG_ARCHIVE_TIMEOUT:-60s}
      - -c
      - hba_file=/etc/harness/pg_hba.conf
      - -c
      - autovacuum_naptime=${PG_AUTOVACUUM_NAPTIME:-30s}
      - -c
      - autovacuum_vacuum_scale_factor=${PG_AUTOVACUUM_VACUUM_SCALE:-0.05}
      - -c
      - autovacuum_analyze_scale_factor=${PG_AUTOVACUUM_ANALYZE_SCALE:-0.02}
      - -c
      - autovacuum_max_workers=${PG_AUTOVACUUM_MAX_WORKERS:-5}
    # Survive Docker/host restarts: DB going away makes the backend crash-loop
    # on DNS until manually restarted (seen 2026-08-22).
    restart: unless-stopped
    # Dev convenience: host-side access for tests/tools. 5499 avoids clashing
    # with a local Postgres already on 5432 (loopback only either way).
    ports:
      - "127.0.0.1:5499:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: migrate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  identity:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: identity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  github:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: github
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  models:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  orchestrator:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: orchestrator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  sandbox:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: sandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  meeting:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: meeting
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  review:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: review
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  frontend:
    # M18-C6 (OPS-24): explicit tag, same scheme as the backend tier —
    # docs/runbooks/rollback.md §1. Frontend and backend roll back together
    # (one HARNESS_IMAGE_TAG drives both).
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      tags:
        - "harness-frontend:v${HARNESS_IMAGE_TAG:-dev-local}"
        - "harness-frontend:latest"
    image: harness-frontend:v${HARNESS_IMAGE_TAG:-dev-local}
    environment:
      NEXT_PUBLIC_API_PREFIX: /api/v1
      NEXT_PUBLIC_IDENTITY_BASE_URL: http://localhost:8001
      NEXT_PUBLIC_ORCHESTRATOR_BASE_URL: http://localhost:8004
      NEXT_PUBLIC_MEETING_URL: http://localhost:8006
      NEXT_PUBLIC_REVIEW_URL: http://localhost:8008
      NEXT_PUBLIC_IDENTITY_WS_URL: ws://localhost:8001
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy

  # Wave 8B — TLS reverse proxy (https://harness.local). Opt-in via the
  # 'proxy' profile so the default `up` stays proxy-free:
  #   docker compose -f deploy/docker-compose.yml --profile proxy up -d proxy
  proxy:
    image: caddy:2-alpine
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy
      github:
        condition: service_healthy
      models:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      meeting:
        condition: service_healthy
      review:
        condition: service_healthy

  # H-018 (M13-W3-H2) — WAL-G PITR, end-to-end. Opt-in via the 'walg' profile
  # so the default `up` stays unchanged (mirrors the wave-8B 'proxy' pattern).
  # TWO services, replacing Mission 10's unexercised sidecar-only scaffold:
  #
  #   walg-db   THE ARCHIVING DATABASE. Same postgres:18 major as `db` but on
  #             the wal-g-capable image (built from deploy/walg/Dockerfile.walg;
  #             `--profile walg build walg-db`), started with
  #             archive_mode=on + archive_command='wal-g wal-push %p'. It owns
  #             its OWN volume (pgdata_walg) and NEVER touches the live
  #             `pgdata`. No host port by default — reach it with
  #             `docker exec`/`docker compose exec walg-db psql ...`; add a
  #             port via a compose.override file if you really need one.
  #   walg      backup wrapper (deploy/runners/backup.sh) doing base backups +
  #             retention + inventory. Default source: the LIVE `db` (OPS-01);
  #             WALG_PGHOST=walg-db re-points one-off runs at this sidecar.
  #
  # OPS-01 (M17-B2) role update: this is now the DRILL/REHEARSAL instance.
  # The live `db` archives WAL itself (same image, same four `-c` flags as
  # below), so the nightly base backup defaults to PGHOST=db and nothing real
  # depends on this sidecar anymore. Its separate `pgdata_walg` volume stays
  # deliberately isolated so restore drills can never collide with live data;
  # point one-off rehearsals at it via WALG_PGHOST=walg-db. Full topology
  # matrix: docs/runbooks/backup-and-pitr.md.
  #
  # 60-second quickstart (file:// storage — no cloud account needed):
  #   export WALG_FILE_PREFIX=/tmp/harness-walg-drill
  #   docker compose -f deploy/docker-compose.yml --profile walg up -d walg-db
  #   docker compose -f deploy/docker-compose.yml --profile walg run --rm walg   # base backup
  #   docker exec walg-db psql -U harness -d harness -tc 'select * from pg_stat_archiver;'
  # Full restore drill with timed RTO/RPO slots: docs/runbooks/backup-and-pitr.md.
  walg-db:
    build:
      context: ..
      dockerfile: deploy/walg/Dockerfile.walg
    image: harness-db-walg:${WALG_IMAGE_TAG:-v3.0.9}
    profiles:
      - walg
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness}
      POSTGRES_DB: harness
      # Storage target + credentials — the SAME variables `db` and `walg` take
      # (declared per-service; compose environment maps don't merge across
      # services). Secrets enter via .env/shell env only, never literals.
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
      WALG_FILE_PREFIX: ${WALG_FILE_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      # Identity wal-g uses when archive_command dials back into THIS server.
      # Deliberately NO PGHOST: unset means libpq uses the default unix socket
      # (/var/run/postgresql), which the official image's stock pg_hba trusts
      # for local connections — so no password ever sits in the
      # archive_command environment, visible in `pg_stat_activity` query text.
      PGUSER: harness
      PGDATABASE: harness
    # Exec-form command (NOT a shell string): every element arrives as one
    # exact argv word, so `%p` needs no shell-quoting gymnastics and cannot be
    # mangled by an intermediary shell. archive_timeout bounds RPO even when
    # the database is quiet (a segment is force-switched every interval).
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=${WALG_ARCHIVE_TIMEOUT:-60s}
      # Custom HBA (deploy/walg/pg_hba.conf): the stock image's generated
      # pg_hba.conf has no `host replication` rule, which every streaming
      # base backup needs — first drill failed on exactly that. The whole
      # DIR is mounted, not the single file: on Docker Desktop/macOS a
      # host-side rewrite of a bind-mounted FILE leaves the container staring
      # at a stale unlinked inode (observed live: nlink=0, open() → ENOENT).
      - -c
      - hba_file=/etc/harness/pg_hba.conf
    volumes:
      - pgdata_walg:/var/lib/postgresql
      - ./walg:/etc/harness:ro
      # file:// drills: share the SAME storage directory between host and the
      # walg-profile containers so a fresh restore container can read what the
      # archiver wrote (container /tmp is otherwise per-container and
      # ephemeral). Same path inside and outside; S3 users can ignore this.
      - "${WALG_FILE_PREFIX:-/tmp/harness-walg-drill}:${WALG_FILE_PREFIX:-/tmp/harness-walg-drill}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Backup wrapper (M10 B4 origin; repointed in M13-W3-H2). One-shot by
  # design — schedule with host cron; the M10 WALG_LOOP knob was retired (a
  # sleeping container has no catch-up after downtime and hides failures).
  #   docker compose -f deploy/docker-compose.yml --profile walg run --rm walg              # base backup
  #   docker compose -f deploy/docker-compose.yml --profile walg run --rm -e BACKUP_MODE=list walg
  # Modes (see deploy/runners/backup.sh): base (default) | wal <seg> | list |
  # retention | config.
  #
  # OPS-01 (M17-B2): default backup source is now the LIVE primary `db`
  # (archive_mode=on + wal-g binary since this lane) — the documented daily
  # base backup protects the cluster that actually holds data. The old drill
  # sidecar remains available for rehearsals via WALG_PGHOST=walg-db; see
  # docs/runbooks/backup-and-pitr.md "Topology" for the full matrix. Run logs
  # append to the walg_logs volume (/var/log/harness-walg), surviving one-shot
  # container removal. The container runs as root ONLY so the log file is
  # writable on the shared volume regardless of which uid created it first;
  # wal-g itself talks to Postgres over TCP as the harness role.
  walg:
    image: harness-db-walg:${WALG_IMAGE_TAG:-v3.0.9}
    profiles:
      - walg
    entrypoint: ["sh", "/opt/harness/deploy/runners/backup.sh"]
    user: root
    environment:
      # Mode precedence: CLI arg > BACKUP_MODE > legacy WALG_MODE > base.
      BACKUP_MODE: ${BACKUP_MODE:-${WALG_MODE:-base}}
      PGHOST: ${WALG_PGHOST:-db}
      PGPORT: "5432"
      PGUSER: harness
      PGPASSWORD: ${POSTGRES_PASSWORD:-harness}
      PGDATABASE: harness
      # Storage target — REQUIRED before anything touches storage.
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
      WALG_FILE_PREFIX: ${WALG_FILE_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      WALG_COMPRESSION_METHOD: ${WALG_COMPRESSION_METHOD:-lz4}
      WALG_RETENTION_KEEP: ${WALG_RETENTION_KEEP:-0}
      WALG_LIST_JSON: ${WALG_LIST_JSON:-}
      WALG_EXTRA_ARGS: ${WALG_EXTRA_ARGS:-}
      WALG_LOG_DIR: /var/log/harness-walg
    volumes:
      # Read-only view of the repo (the wrapper script lives here):
      - ./:/opt/harness/deploy:ro
      # Persistent run logs (one-shot containers vanish; their logs stay):
      - walg_logs:/var/log/harness-walg
      # file:// drills: same storage dir as walg-db (see the note there):
      - "${WALG_FILE_PREFIX:-/tmp/harness-walg-drill}:${WALG_FILE_PREFIX:-/tmp/harness-walg-drill}"
    depends_on:
      walg-db:
        condition: service_healthy
    restart: "no"

  # Mission 12 G1 — agent_events retention sweep (raw-05 #1: unbounded growth).
  # Opt-in via the 'events-retention' profile so the default `up` stays
  # unchanged, mirroring the wave-8B 'proxy' / Mission-10 'walg' pattern:
  #   docker compose -f deploy/docker-compose.yml --profile events-retention up -d events-retention
  #   docker compose -f deploy/docker-compose.yml --profile events-retention run --rm events-retention --once
  # The command is driven by EVENTS_RETENTION_MODE (`once` | `loop`) or the
  # --once/--loop flags; default is `loop`, which sweeps every
  # RUN_INTERVAL_SECONDS. `once` exits after a single sweep (pair with host
  # cron or an external scheduler for exact timing).
  events-retention:
    <<: *backend-build
    profiles:
      - events-retention
    # Bypass the shared entrypoint.sh: with HARNESS_SERVICE unset it would boot
    # the whole legacy all-in-one stack, but this sidecar IS one python job.
    entrypoint: ["python", "/opt/harness/deploy/runners/events_retention.py"]
    environment:
      HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@db:5432/harness
      # Retention knobs (see deploy/runners/events_retention.py):
      EVENTS_RETENTION_MODE: ${EVENTS_RETENTION_MODE:-loop}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      BATCH_SIZE: ${BATCH_SIZE:-5000}
      RUN_INTERVAL_SECONDS: ${RUN_INTERVAL_SECONDS:-21600}
      # M19-N3 (F8): outbox/audit prune windows (see
      # deploy/runners/events_retention.py).
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # M18-C3 (m17-findings F6) — daily per-team cost rollup feeding
  # cost_ledger_daily (migration 0027) so the budget gate reads closed-day
  # spend O(1) instead of SUMming the whole cost_ledger per run start.
  # Opt-in via the 'cost-rollup' profile (mirrors 'events-retention'):
  #   docker compose -f deploy/docker-compose.yml --profile cost-rollup up -d cost-rollup
  #   docker compose -f deploy/docker-compose.yml --profile cost-rollup run --rm cost-rollup --once
  # The first pass backfills ALL history (flipping the gate onto the rollup
  # path); loop mode recomputes every RUN_INTERVAL_SECONDS. Until it runs,
  # the gate keeps its exact whole-ledger fallback.
  cost-rollup:
    <<: *backend-build
    profiles:
      - cost-rollup
    # Bypass the shared entrypoint.sh: with HARNESS_SERVICE unset it would boot
    # the whole legacy all-in-one stack, but this sidecar IS one python job.
    entrypoint: ["python", "/opt/harness/deploy/runners/cost_rollup.py"]
    environment:
      HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@db:5432/harness
      COST_ROLLUP_MODE: ${COST_ROLLUP_MODE:-loop}
      RUN_INTERVAL_SECONDS: ${RUN_INTERVAL_SECONDS:-21600}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # M15-W5-D2 (DB#12) — scheduled VACUUM (ANALYZE) for the three highest-churn
  # tables (agent_events, rate_buckets, audit_log), opt-in via the
  # 'maintenance' profile (mirrors the wave-8B 'proxy' / Mission-10 'walg' /
  # Mission-12 'events-retention' pattern):
  #   docker compose -f deploy/docker-compose.yml --profile maintenance up -d db-maintenance
  #   docker compose -f deploy/docker-compose.yml --profile maintenance run --rm db-maintenance once
  # Cadence is env-tunable: MAINTENANCE_INTERVAL_SECONDS (default 604800 = one
  # week) drives loop mode; `once` exits after a single pass (host cron pair,
  # see docs/runbooks/maintenance.md for the crontab). Reindexing is OFF by
  # default and flips on with MAINTENANCE_REINDEX=1 (REINDEX TABLE
  # CONCURRENTLY — no exclusive lock, but real I/O).
  #
  # Runs on the stock postgres:18-alpine image (NOT the slim backend image):
  # it ships the psql client this job needs and nothing else. Talks to `db`
  # over TCP with libpq env only — no superuser assumptions beyond the harness
  # role owning the tables. Runs as root ONLY so the log/state volumes stay
  # writable regardless of which uid created them first (same reasoning as the
  # `walg` wrapper); psql itself needs no privileges.
  #
  # Scheduling honesty (M13 retired WALG_LOOP for hiding gaps): loop mode runs
  # ONE pass immediately at startup and then every interval, so downtime
  # collapses missed cycles into a single catch-up run instead of silently
  # skipping them; failures log loudly every cycle and never exit 0 in `once`
  # mode. Run logs append to the maintenance_logs volume, state (lock + last-
  # run stamp) lives in maintenance_state — both survive --rm/restarts.
  db-maintenance:
    image: postgres:18-alpine
    profiles:
      - maintenance
    entrypoint: ["sh", "/opt/harness/scripts/maintenance.sh"]
    user: root
    environment:
      PGHOST: ${MAINTENANCE_PGHOST:-db}
      PGPORT: "5432"
      PGUSER: harness
      PGPASSWORD: ${POSTGRES_PASSWORD:-harness}
      PGDATABASE: harness
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-loop}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-604800}
      MAINTENANCE_TABLES: ${MAINTENANCE_TABLES:-agent_events rate_buckets audit_log}
      MAINTENANCE_REINDEX: ${MAINTENANCE_REINDEX:-0}
      MAINTENANCE_LOG_DIR: /var/log/harness-maintenance
      MAINTENANCE_LOCK_DIR: /var/lib/harness-maintenance/lock
      MAINTENANCE_STAMP_DIR: /var/lib/harness-maintenance/stamp
    volumes:
      # Read-only view of the repo scripts (the job lives here):
      - ../scripts:/opt/harness/scripts:ro
      # Persistent run logs survive one-shot containers (--rm) and restarts:
      - maintenance_logs:/var/log/harness-maintenance
      # Lock + last-run stamps (catch-up/dedup decisions need persistence):
      - maintenance_state:/var/lib/harness-maintenance
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # M14-P2 — LEGACY all-in-one backend, opt-in via the 'legacy-backend'
  # profile so the default split-service topology stays untouched (mirrors
  # the wave-8B 'proxy' / Mission-10 'walg' pattern).
  #
  # WHY THIS BLOCK EXISTS: the crash-looping harness-backend-1 of W2/W3 was
  # an ORPHAN from the pre-split revision — a container whose service had
  # vanished from this file, left detached from every network
  # (`docker inspect` showed Networks: {}). With no user-defined bridge there
  # is no embedded resolver at 127.0.0.1:53 inside it, so getaddrinfo("db")
  # fails with EAI_AGAIN (`[Errno -3] Temporary failure in name resolution`),
  # entrypoint.sh exits 1 and Docker restarts it instantly — forever.
  # Declaring the service HERE makes that state impossible to re-enter:
  # compose now owns it, attaches it to the pinned default network, and can
  # recreate/upgrade/remove it like any other service.
  #
  #   docker compose -f deploy/docker-compose.yml --profile legacy-backend up -d backend
  #   docker compose -f deploy/docker-compose.yml --profile legacy-backend stop backend
  backend:
    <<: *backend-build
    profiles:
      - legacy-backend
    environment:
      <<: *backend-env
      # Empty HARNESS_SERVICE selects the all-in-one path in entrypoint.sh
      # (runs migrate + seeds + supervises uvicorn on 8001-8008 in one PID ns).
      HARNESS_SERVICE: ""
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    dns:
      # Embedded Docker resolver FIRST (service names on harness_default),
      # upstream public fallback second for anything external. Belt-and-braces:
      # if the network's embedded DNS wedges (the VT-5 failure mode), lookups
      # degrade to upstream instead of hard-crashing the boot sequence.
      - 127.0.0.11
      - 8.8.8.8
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\""]
      interval: 15s
      timeout: 4s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    depends_on: *backend-depends

  # M18-C4 — throughput truth probe (scripts/loadtest/). An ISOLATED stack for
  # load testing: its own Postgres volume + ports (15499/18001/18004), so probe
  # traffic never touches live data and live traffic never pollutes numbers.
  # Engine boots DRY (ENGINE_LIVE_MODE=dry) — no provider calls, zero model
  # spend; HARNESS_REQUIRE_OWNERSHIP=false lets the passwordless login the
  # loadtest flow drives mint teams. Usage:
  #
  #   docker compose -f deploy/docker-compose.yml -p harness-loadtest \
  #     --profile loadtest up -d db-loadtest migrate-loadtest identity-loadtest orchestrator-loadtest
  #   python3 scripts/loadtest/smoke_probe.py \
  #     --identity http://localhost:18001 --orchestrator http://localhost:18004
  #   ... drive locust per scripts/loadtest/README.md ...
  #   docker compose -f deploy/docker-compose.yml -p harness-loadtest --profile loadtest down -v
  db-loadtest:
    image: postgres:18-alpine
    profiles:
      - loadtest
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    command:
      - postgres
      - -c
      - max_connections=120
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:15499:5432"

  migrate-loadtest:
    <<: *backend-build
    profiles:
      - loadtest
    environment:
      <<: *backend-env
      HARNESS_SERVICE: migrate
      HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@db-loadtest:5432/harness
      # Throwaway isolated DB + dev key opt-in (services.py F9 fail-fast).
      HARNESS_ALLOW_DEV_MASTER_KEY: "1"
    depends_on:
      db-loadtest:
        condition: service_healthy
    restart: "no"

  identity-loadtest:
    <<: *backend-build
    profiles:
      - loadtest
    environment:
      <<: *backend-env
      HARNESS_SERVICE: identity
      HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@db-loadtest:5432/harness
      # The probe flow drives the passwordless login endpoint.
      HARNESS_REQUIRE_OWNERSHIP: "false"
      # Throwaway isolated DB + dev key opt-in (services.py F9 fail-fast).
      HARNESS_ALLOW_DEV_MASTER_KEY: "1"
      # M18-C4 gotcha (hit live): x-backend-env always exports
      # HARNESS_MASTER_KEY=""; pydantic-settings (env_prefix=HARNESS_,
      # field master_key) then OVERRIDES services.py's module-level dev-key
      # fallback with that empty string -> KeyVault "master_key must be
      # non-empty". Give the isolated stack an explicit throwaway key: empty
      # by default, so the runner's own F9 dev fallback supplies the public
      # constant under the already-set ALLOW_DEV opt-in — no baked-in secret
      # default ships in compose (H-005/C-004 compose law).
      HARNESS_MASTER_KEY: ${PROBE_MASTER_KEY:-}
    ports:
      - "127.0.0.1:18001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on:
      migrate-loadtest:
        condition: service_completed_successfully
      db-loadtest:
        condition: service_healthy

  orchestrator-loadtest:
    <<: *backend-build
    profiles:
      - loadtest
    environment:
      <<: *backend-env
      HARNESS_SERVICE: orchestrator
      HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@db-loadtest:5432/harness
      # C-004/H-006 engine-boot law: mode is explicit. DRY = honest stub, no
      # provider credentials needed, zero spend — the probe measures platform
      # throughput, not provider network latency.
      ENGINE_LIVE_MODE: dry
      # M18-C4: injected echo backend (see deploy/runners/services.py) so runs
      # COMPLETE deterministically and the executor/queue ceiling is real.
      ENGINE_BACKEND_ECHO: ${PROBE_ENGINE_ECHO:-1}
      ENGINE_ECHO_WORK_MS: ${PROBE_ENGINE_WORK_MS:-50}
      # Probe knobs (documented in docs/benchmarks/BASELINE.md):
      ENGINE_MAX_CONCURRENCY: ${PROBE_ENGINE_MAX_CONCURRENCY:-8}
      HARNESS_RUN_CONCURRENCY: ${PROBE_RUN_CONCURRENCY:-4}
      HARNESS_WORKER_POLL_SECONDS: ${PROBE_WORKER_POLL_SECONDS:-0.5}
      HARNESS_TEAM_BUDGET_USD: ${PROBE_TEAM_BUDGET_USD:-}
      # Throwaway isolated DB + dev key opt-in (services.py F9 fail-fast).
      HARNESS_ALLOW_DEV_MASTER_KEY: "1"
      # Same pydantic-settings override gotcha as identity-loadtest above:
      # empty default ⇒ runner's own F9 dev fallback supplies the key under
      # the ALLOW_DEV opt-in — no baked-in secret default ships in compose.
      HARNESS_MASTER_KEY: ${PROBE_MASTER_KEY:-}
    ports:
      - "127.0.0.1:18004:8004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on:
      migrate-loadtest:
        condition: service_completed_successfully
      db-loadtest:
        condition: service_healthy

# M14-P2 network hardening: declare the default network EXPLICITLY instead of
# letting compose synthesize it. Pinning name/attachable/driver makes
# `docker compose up` deterministic after any external `docker network rm`
# (the VT-documented wedge-breaker) and documents the embedded-DNS contract
# every service relies on for `db`-style lookups.
networks:
  default:
    name: harness_default
    driver: bridge
    attachable: true

volumes:
  pgdata:
  # M18-C4: isolated load-test database volume (db-loadtest service). Lives
  # only under the harness-loadtest project; `... --profile loadtest down -v`
  # removes it with the stack.
  pgdata_loadtest:
  # H-018 (M13-W3-H2): the archiving database's own data volume — deliberately
  # SEPARATE from `pgdata` so PITR drills can never collide with live data.
  pgdata_walg:
  # Run logs of the one-shot backup wrapper (`walg` service) survive container
  # removal here (mounted at /var/log/harness-walg).
  walg_logs:
  # M15-W5-D2: db-maintenance run logs (mounted at
  # /var/log/harness-maintenance) survive --rm/restarts.
  maintenance_logs:
  # M15-W5-D2: db-maintenance lock dir + last-run stamps (mounted at
  # /var/lib/harness-maintenance) — concurrency guard and catch-up decisions
  # must outlive any single container run.
  maintenance_state:
  caddy_data:
  caddy_config:
