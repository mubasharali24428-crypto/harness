name: harness

x-backend-build: &backend-build
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile

x-backend-env: &backend-env
  HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@db:5432/harness
  # H-005 (M11-W1-B1): no master-key dev default ships here anymore.
  # Empty default keeps `docker compose config` valid while services.py's
  # fail-fast refuses to boot without a real key; opt back into local dev
  # EXPLICITLY via HARNESS_ALLOW_DEV_MASTER_KEY=1.
  HARNESS_MASTER_KEY: ${HARNESS_MASTER_KEY:-}
  HARNESS_ALLOW_DEV_MASTER_KEY: ${HARNESS_ALLOW_DEV_MASTER_KEY:-}
  HARNESS_CORS_ORIGINS: ${HARNESS_CORS_ORIGINS:-["http://localhost:3000"]}
  HARNESS_REQUIRE_OWNERSHIP: ${HARNESS_REQUIRE_OWNERSHIP:-false}
  # C-004/H-006 (M11-W1-B1): engine mode is EXPLICIT and validated at
  # boot (deploy/runners/engine_boot.py). Placeholder credentials are gone:
  # no "ollama" API-key default, no implicit host-Ollama endpoint, no
  # silent provider/model fallback. Unset ⇒ dry engine (honest stub).
  ENGINE_LIVE_MODE: ${ENGINE_LIVE_MODE:-dry}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
  DSH_MODEL: ${DSH_MODEL:-qwen3.5-9b-128k:latest}
  DSH_WORKSPACE: /tmp/harness-dsh/workspace
  DSH_SESSION_ROOT: /tmp/harness-dsh/sessions
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  # S2's Settings use the HARNESS_ prefix — map the well-known names across.
  HARNESS_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  HARNESS_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  HARNESS_FRONTEND_BASE: ${FRONTEND_BASE:-http://localhost:3000}
  HARNESS_GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8002/api/v1/github/oauth/callback}
  HARNESS_SMTP_HOST: ${HARNESS_SMTP_HOST:-}
  HARNESS_SMTP_PORT: ${HARNESS_SMTP_PORT:-587}
  HARNESS_SMTP_USERNAME: ${HARNESS_SMTP_USERNAME:-}
  HARNESS_SMTP_PASSWORD: ${HARNESS_SMTP_PASSWORD:-}
  HARNESS_SMTP_FROM: ${HARNESS_SMTP_FROM:-harness@noreply.local}
  HARNESS_SMTP_STARTTLS: ${HARNESS_SMTP_STARTTLS:-true}

x-backend-depends: &backend-depends
  migrate:
    condition: service_completed_successfully
  db:
    condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    volumes:
      - pgdata:/var/lib/postgresql
    # Survive Docker/host restarts: DB going away makes the backend crash-loop
    # on DNS until manually restarted (seen 2026-08-22).
    restart: unless-stopped
    # Dev convenience: host-side access for tests/tools. 5499 avoids clashing
    # with a local Postgres already on 5432 (loopback only either way).
    ports:
      - "127.0.0.1:5499:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: migrate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  identity:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: identity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  github:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: github
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  models:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  orchestrator:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: orchestrator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  sandbox:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: sandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  meeting:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: meeting
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  review:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: review
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_PREFIX: /api/v1
      NEXT_PUBLIC_IDENTITY_BASE_URL: http://localhost:8001
      NEXT_PUBLIC_ORCHESTRATOR_BASE_URL: http://localhost:8004
      NEXT_PUBLIC_MEETING_URL: http://localhost:8006
      NEXT_PUBLIC_REVIEW_URL: http://localhost:8008
      NEXT_PUBLIC_IDENTITY_WS_URL: ws://localhost:8001
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy

  # Wave 8B — TLS reverse proxy (https://harness.local). Opt-in via the
  # 'proxy' profile so the default `up` stays proxy-free:
  #   docker compose -f deploy/docker-compose.yml --profile proxy up -d proxy
  proxy:
    image: caddy:2-alpine
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy
      github:
        condition: service_healthy
      models:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      meeting:
        condition: service_healthy
      review:
        condition: service_healthy

  # Mission 10 B4 — WAL-G PITR sidecar (base backups + retention). Opt-in via
  # the 'walg' profile so the default `up` stays unchanged, mirroring the
  # wave-8B 'proxy' pattern above:
  #   docker compose -f deploy/docker-compose.yml --profile walg run --rm walg base   # one-shot
  #   docker compose -f deploy/docker-compose.yml --profile walg up -d walg           # cron-ish loop
  #
  # ONE-SHOT vs LOOP: the command is driven by WALG_MODE. `oneshot` runs a
  # single base backup and exits (pair with host cron or an external scheduler).
  # `loop` sleeps WALG_INTERVAL_SECONDS between runs (a poor man's scheduler —
  # no catch-up if the container was down; prefer one-shot + host cron for
  # exact timing). WAL archiving itself is NOT this container's job: it is
  # done by archive_command inside the db container once the db image carries
  # the wal-g binary (build deploy/walg/Dockerfile.walg; documented as a
  # FUTURE compose db-service change in docs/runbooks/backup-and-pitr.md).
  walg:
    image: postgres:18-alpine
    profiles:
      - walg
    entrypoint: ["sh", "/opt/harness/deploy/walg/backup-walg.sh"]
    environment:
      # Storage target — REQUIRED in real use; defaults keep `config` mode runnable.
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
      WALG_FILE_PREFIX: ${WALG_FILE_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      # Same DB identity/env family as the db + backend services above.
      PGHOST: ${WALG_PGHOST:-db}
      PGPORT: "5432"
      PGUSER: harness
      PGPASSWORD: ${POSTGRES_PASSWORD:-harness}
      PGDATABASE: harness
      WALG_COMPRESSION_METHOD: ${WALG_COMPRESSION_METHOD:-lz4}
      WALG_RETENTION_KEEP: ${WALG_RETENTION_KEEP:-0}
      # base | wal | list | retention | config (see backup-walg.sh usage)
      WALG_MODE: ${WALG_MODE:-config}
      # oneshot | loop (loop re-runs WALG_MODE every WALG_INTERVAL_SECONDS)
      WALG_LOOP: ${WALG_LOOP:-oneshot}
      WALG_INTERVAL_SECONDS: ${WALG_INTERVAL_SECONDS:-86400}
    volumes:
      # Read-only view of the repo (the backup script) + of the pgdata volume,
      # for LOCAL-mode base backups (`backup-push <pgdata>` per upstream docs).
      # Streaming mode (WALG_STREAM_BACKUP=1) needs only the env above.
      - ./:/opt/harness/deploy:ro
      - pgdata:/var/lib/postgresql/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
