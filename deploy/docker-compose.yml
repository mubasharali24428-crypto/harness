name: harness

x-backend-build: &backend-build
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile

x-backend-env: &backend-env
  HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@db:5432/harness
  # H-005 (M11-W1-B1): no master-key dev default ships here anymore.
  # Empty default keeps `docker compose config` valid while services.py's
  # fail-fast refuses to boot without a real key; opt back into local dev
  # EXPLICITLY via HARNESS_ALLOW_DEV_MASTER_KEY=1.
  HARNESS_MASTER_KEY: ${HARNESS_MASTER_KEY:-}
  HARNESS_ALLOW_DEV_MASTER_KEY: ${HARNESS_ALLOW_DEV_MASTER_KEY:-}
  HARNESS_CORS_ORIGINS: ${HARNESS_CORS_ORIGINS:-["http://localhost:3000"]}
  # C-001 (M11-W1): default ON — unverified email cannot mint admin teams.
  HARNESS_REQUIRE_OWNERSHIP: ${HARNESS_REQUIRE_OWNERSHIP:-true}
  # C-004/H-006 (M11-W1-B1): engine mode is EXPLICIT and validated at
  # boot (deploy/runners/engine_boot.py). Placeholder/dev defaults are
  # gone: no placeholder API-key value, no implicit local-provider
  # endpoint, no baked-in dev model name, no silent provider/model
  # fallback. Required variables stay UNSET for the operator; boot fails
  # loudly (variable NAMES only) until they are provided.
  # Host-unset ENGINE_LIVE_MODE ⇒ container boots dry (honest stub).
  ENGINE_LIVE_MODE: ${ENGINE_LIVE_MODE:-dry}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
  DSH_MODEL: ${DSH_MODEL:-}
  DSH_WORKSPACE: /tmp/harness-dsh/workspace
  DSH_SESSION_ROOT: /tmp/harness-dsh/sessions
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  # S2's Settings use the HARNESS_ prefix — map the well-known names across.
  HARNESS_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  HARNESS_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  HARNESS_FRONTEND_BASE: ${FRONTEND_BASE:-http://localhost:3000}
  HARNESS_GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8002/api/v1/github/oauth/callback}
  HARNESS_SMTP_HOST: ${HARNESS_SMTP_HOST:-}
  HARNESS_SMTP_PORT: ${HARNESS_SMTP_PORT:-587}
  HARNESS_SMTP_USERNAME: ${HARNESS_SMTP_USERNAME:-}
  HARNESS_SMTP_PASSWORD: ${HARNESS_SMTP_PASSWORD:-}
  HARNESS_SMTP_FROM: ${HARNESS_SMTP_FROM:-harness@noreply.local}
  HARNESS_SMTP_STARTTLS: ${HARNESS_SMTP_STARTTLS:-true}

x-backend-depends: &backend-depends
  migrate:
    condition: service_completed_successfully
  db:
    condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
      # H-018 (M13-W3-H2): WAL-G PITR knobs, sourced from .env like every other
      # secret/knob (never literal here). INERT on the stock postgres image —
      # it has neither wal-g nor archiving enabled. They matter once either
      # happens (see docs/runbooks/backup-and-pitr.md):
      #   a) you run the opt-in `walg-db` service (same profile, reads the SAME
      #      variables itself — declared twice because compose env is
      #      per-service), or
      #   b) you swap THIS service's image to harness-db-walg (built from
      #      deploy/walg/Dockerfile.walg) and add the archive_mode/archive_command
      #      command flags documented in the runbook — then these arrive
      #      already wired, no further env edits.
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
      WALG_FILE_PREFIX: ${WALG_FILE_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
    volumes:
      - pgdata:/var/lib/postgresql
    # M13-W3-H1a pool math (docs/pool-math.md): 7 services × (pool_size=8 +
    # max_overflow=4) = 84 connections worst case; 120 leaves 36 slots of
    # headroom for migrations, admin tooling and operator psql.
    command:
      ["postgres", "-c", "max_connections=120"]
    # Survive Docker/host restarts: DB going away makes the backend crash-loop
    # on DNS until manually restarted (seen 2026-08-22).
    restart: unless-stopped
    # Dev convenience: host-side access for tests/tools. 5499 avoids clashing
    # with a local Postgres already on 5432 (loopback only either way).
    ports:
      - "127.0.0.1:5499:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: migrate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  identity:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: identity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  github:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: github
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  models:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  orchestrator:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: orchestrator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  sandbox:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: sandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  meeting:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: meeting
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  review:
    <<: *backend-build
    environment:
      <<: *backend-env
      HARNESS_SERVICE: review
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3)\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    depends_on: *backend-depends

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_PREFIX: /api/v1
      NEXT_PUBLIC_IDENTITY_BASE_URL: http://localhost:8001
      NEXT_PUBLIC_ORCHESTRATOR_BASE_URL: http://localhost:8004
      NEXT_PUBLIC_MEETING_URL: http://localhost:8006
      NEXT_PUBLIC_REVIEW_URL: http://localhost:8008
      NEXT_PUBLIC_IDENTITY_WS_URL: ws://localhost:8001
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy

  # Wave 8B — TLS reverse proxy (https://harness.local). Opt-in via the
  # 'proxy' profile so the default `up` stays proxy-free:
  #   docker compose -f deploy/docker-compose.yml --profile proxy up -d proxy
  proxy:
    image: caddy:2-alpine
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      identity:
        condition: service_healthy
      github:
        condition: service_healthy
      models:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      meeting:
        condition: service_healthy
      review:
        condition: service_healthy

  # H-018 (M13-W3-H2) — WAL-G PITR, end-to-end. Opt-in via the 'walg' profile
  # so the default `up` stays unchanged (mirrors the wave-8B 'proxy' pattern).
  # TWO services, replacing Mission 10's unexercised sidecar-only scaffold:
  #
  #   walg-db   THE ARCHIVING DATABASE. Same postgres:18 major as `db` but on
  #             the wal-g-capable image (built from deploy/walg/Dockerfile.walg;
  #             `--profile walg build walg-db`), started with
  #             archive_mode=on + archive_command='wal-g wal-push %p'. It owns
  #             its OWN volume (pgdata_walg) and NEVER touches the live
  #             `pgdata`. No host port by default — reach it with
  #             `docker exec`/`docker compose exec walg-db psql ...`; add a
  #             port via a compose.override file if you really need one.
  #   walg      backup wrapper (deploy/runners/backup.sh) doing base backups +
  #             retention + inventory against walg-db.
  #
  # Why a separate archiving instance instead of flipping `db` itself: `db`
  # serves every backend in the default dev stack; changing ITS image/command
  # is outside this lane's ownership and would couple everyone's boot to the
  # wal-g binary. walg-db gives continuous archiving + PITR drills today with
  # zero effect on the default stack. Operators who later promote archiving
  # onto the primary: swap `db`'s image to the same harness-db-walg image and
  # add the identical command flags shown below — the WAL-G/AWS env knobs are
  # already wired in `db`'s env block for exactly that move.
  #
  # 60-second quickstart (file:// storage — no cloud account needed):
  #   export WALG_FILE_PREFIX=/tmp/harness-walg-drill
  #   docker compose -f deploy/docker-compose.yml --profile walg up -d walg-db
  #   docker compose -f deploy/docker-compose.yml --profile walg run --rm walg   # base backup
  #   docker exec walg-db psql -U harness -d harness -tc 'select * from pg_stat_archiver;'
  # Full restore drill with timed RTO/RPO slots: docs/runbooks/backup-and-pitr.md.
  walg-db:
    build:
      context: ..
      dockerfile: deploy/walg/Dockerfile.walg
    image: harness-db-walg:${WALG_IMAGE_TAG:-v3.0.9}
    profiles:
      - walg
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness}
      POSTGRES_DB: harness
      # Storage target + credentials — the SAME variables `db` and `walg` take
      # (declared per-service; compose environment maps don't merge across
      # services). Secrets enter via .env/shell env only, never literals.
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
      WALG_FILE_PREFIX: ${WALG_FILE_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      # Identity wal-g uses when archive_command dials back into THIS server.
      # Deliberately NO PGHOST: unset means libpq uses the default unix socket
      # (/var/run/postgresql), which the official image's stock pg_hba trusts
      # for local connections — so no password ever sits in the
      # archive_command environment, visible in `pg_stat_activity` query text.
      PGUSER: harness
      PGDATABASE: harness
    # Exec-form command (NOT a shell string): every element arrives as one
    # exact argv word, so `%p` needs no shell-quoting gymnastics and cannot be
    # mangled by an intermediary shell. archive_timeout bounds RPO even when
    # the database is quiet (a segment is force-switched every interval).
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=${WALG_ARCHIVE_TIMEOUT:-60s}
      # Custom HBA (deploy/walg/pg_hba.conf): the stock image's generated
      # pg_hba.conf has no `host replication` rule, which every streaming
      # base backup needs — first drill failed on exactly that. The whole
      # DIR is mounted, not the single file: on Docker Desktop/macOS a
      # host-side rewrite of a bind-mounted FILE leaves the container staring
      # at a stale unlinked inode (observed live: nlink=0, open() → ENOENT).
      - -c
      - hba_file=/etc/harness/pg_hba.conf
    volumes:
      - pgdata_walg:/var/lib/postgresql
      - ./walg:/etc/harness:ro
      # file:// drills: share the SAME storage directory between host and the
      # walg-profile containers so a fresh restore container can read what the
      # archiver wrote (container /tmp is otherwise per-container and
      # ephemeral). Same path inside and outside; S3 users can ignore this.
      - "${WALG_FILE_PREFIX:-/tmp/harness-walg-drill}:${WALG_FILE_PREFIX:-/tmp/harness-walg-drill}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Backup wrapper (M10 B4 origin; repointed in M13-W3-H2). One-shot by
  # design — schedule with host cron; the M10 WALG_LOOP knob was retired (a
  # sleeping container has no catch-up after downtime and hides failures).
  #   docker compose -f deploy/docker-compose.yml --profile walg run --rm walg              # base backup
  #   docker compose -f deploy/docker-compose.yml --profile walg run --rm -e BACKUP_MODE=list walg
  # Modes (see deploy/runners/backup.sh): base (default) | wal <seg> | list |
  # retention | config. Targets the ARCHIVING db (PGHOST defaults to
  # walg-db); override WALG_PGHOST=db to stream a base backup off the LIVE
  # primary instead (its stock image lacks wal-g — that combination requires
  # the image swap described at `db` above). Run logs append to the walg_logs
  # volume (/var/log/harness-walg), surviving one-shot container removal.
  # The container runs as root ONLY so the log file is writable on the shared
  # volume regardless of which uid created it first; wal-g itself talks to
  # Postgres over TCP as the harness role.
  walg:
    image: harness-db-walg:${WALG_IMAGE_TAG:-v3.0.9}
    profiles:
      - walg
    entrypoint: ["sh", "/opt/harness/deploy/runners/backup.sh"]
    user: root
    environment:
      # Mode precedence: CLI arg > BACKUP_MODE > legacy WALG_MODE > base.
      BACKUP_MODE: ${BACKUP_MODE:-${WALG_MODE:-base}}
      PGHOST: ${WALG_PGHOST:-walg-db}
      PGPORT: "5432"
      PGUSER: harness
      PGPASSWORD: ${POSTGRES_PASSWORD:-harness}
      PGDATABASE: harness
      # Storage target — REQUIRED before anything touches storage.
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
      WALG_FILE_PREFIX: ${WALG_FILE_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      WALG_COMPRESSION_METHOD: ${WALG_COMPRESSION_METHOD:-lz4}
      WALG_RETENTION_KEEP: ${WALG_RETENTION_KEEP:-0}
      WALG_LIST_JSON: ${WALG_LIST_JSON:-}
      WALG_EXTRA_ARGS: ${WALG_EXTRA_ARGS:-}
      WALG_LOG_DIR: /var/log/harness-walg
    volumes:
      # Read-only view of the repo (the wrapper script lives here):
      - ./:/opt/harness/deploy:ro
      # Persistent run logs (one-shot containers vanish; their logs stay):
      - walg_logs:/var/log/harness-walg
      # file:// drills: same storage dir as walg-db (see the note there):
      - "${WALG_FILE_PREFIX:-/tmp/harness-walg-drill}:${WALG_FILE_PREFIX:-/tmp/harness-walg-drill}"
    depends_on:
      walg-db:
        condition: service_healthy
    restart: "no"

  # Mission 12 G1 — agent_events retention sweep (raw-05 #1: unbounded growth).
  # Opt-in via the 'events-retention' profile so the default `up` stays
  # unchanged, mirroring the wave-8B 'proxy' / Mission-10 'walg' pattern:
  #   docker compose -f deploy/docker-compose.yml --profile events-retention up -d events-retention
  #   docker compose -f deploy/docker-compose.yml --profile events-retention run --rm events-retention --once
  # The command is driven by EVENTS_RETENTION_MODE (`once` | `loop`) or the
  # --once/--loop flags; default is `loop`, which sweeps every
  # RUN_INTERVAL_SECONDS. `once` exits after a single sweep (pair with host
  # cron or an external scheduler for exact timing).
  events-retention:
    <<: *backend-build
    profiles:
      - events-retention
    # Bypass the shared entrypoint.sh: with HARNESS_SERVICE unset it would boot
    # the whole legacy all-in-one stack, but this sidecar IS one python job.
    entrypoint: ["python", "/opt/harness/deploy/runners/events_retention.py"]
    environment:
      HARNESS_DATABASE_URL: postgresql+asyncpg://harness:harness@db:5432/harness
      # Retention knobs (see deploy/runners/events_retention.py):
      EVENTS_RETENTION_MODE: ${EVENTS_RETENTION_MODE:-loop}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      BATCH_SIZE: ${BATCH_SIZE:-5000}
      RUN_INTERVAL_SECONDS: ${RUN_INTERVAL_SECONDS:-21600}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  # H-018 (M13-W3-H2): the archiving database's own data volume — deliberately
  # SEPARATE from `pgdata` so PITR drills can never collide with live data.
  pgdata_walg:
  # Run logs of the one-shot backup wrapper (`walg` service) survive container
  # removal here (mounted at /var/log/harness-walg).
  walg_logs:
  caddy_data:
  caddy_config:
