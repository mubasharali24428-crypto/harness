# deploy/walg/pg_hba.conf — client-auth rules for the ARCHIVING database
# (compose service `walg-db`, M13-W3-H2). Mounted read-only and selected with
# `postgres -c hba_file=/etc/harness/pg_hba.conf`.
#
# WHY THIS FILE EXISTS: wal-g's STREAMING base backup connects over the
# replication protocol, and the stock official-image pg_hba.conf has no
# `host replication` rule — first drill attempt (2026-08-24) failed with
# `FATAL: no pg_hba.conf entry for replication connection from host
# "172.22.0.12", user "harness"` before this file existed.
#
# Posture: matches the rest of the DEV compose stack (trusted network,
# well-known dev password). 172.16.0.0/12 covers Docker's default bridge
# pools; unix-socket lines keep the archive_command connection passwordless.
# For anything exposed beyond a laptop, switch these to scram-sha-256 and set
# POSTGRES_PASSWORD properly — see docs/runbooks/backup-and-pitr.md.
local   all             all                                     trust
host    all             all                     127.0.0.1/32    trust
host    all             all                     ::1/128         trust
# WAL-G streaming base backups (BASE_BACKUP protocol):
host    replication     harness                 172.16.0.0/12   trust
# WAL-G's initial control connection (plain, before it requests replication):
host    all             all                     172.16.0.0/12   trust
