[project]
name = "harness-mcp"
version = "1.0.0rc1"
description = "AI Engineering Harness as a Model Context Protocol (MCP) tool server: start_run / get_run_status / search_context / list_projects over stdio + streamable HTTP."
requires-python = ">=3.11"
dependencies = [
    "harness-contracts",
    # Z1 (mcp version call): tests + server target the 1.x API surface —
    # 2.x removed `mcp.server.fastmcp` internals the protocol tests pin.
    # Verified: 18/18 under mcp==1.30.0, 1 failed/13 errors under 2.1.1.
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "anyio>=4",
    "uvicorn>=0.30",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
harness-mcp = "harness_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests", "../contracts/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
